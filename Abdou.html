<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A Letter For You ♡</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: #fff;
            font-family: Georgia, "Times New Roman", serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
        }

        .letter {
            width: 100%;
            max-width: 700px;
            background: #fffafa;
            border: 1px solid #f0d9de;
            border-radius: 35px;
            padding: 50px 45px;
            box-shadow: 0 15px 50px rgba(120, 20, 40, 0.12);
            text-align: center;
        }

        .top {
            font-size: 35px;
            margin-bottom: 15px;
        }

        h1 {
            color: #8f1830;
            font-size: 38px;
            font-weight: normal;
            font-style: italic;
            margin-bottom: 30px;
        }

        .text {
            color: #555;
            font-size: 18px;
            line-height: 2;
            text-align: left;
        }

        .bottom {
            margin-top: 35px;
            color: #9e1830;
            font-size: 25px;
        }

        @media (max-width: 600px) {
            .letter {
                padding: 35px 25px;
            }

            h1 {
                font-size: 32px;
            }

            .text {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <div class="letter">

        <div class="top">🎀</div>

        <h1>A little message for you</h1>

        <p class="text">
            WRITE YOUR PARAGRAPH HERE.
            <br><br>
            You can write everything you want to say here,
            in your own words and in your own way.
        </p>

        <div class="bottom">
            ♡ ♡ ♡
        </div>

    </div>

</body>
</html>
