<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You ❤️</title>
 
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ffd6e8,#ffeef5,#fff7fb);
overflow:hidden;
}

.container{
text-align:center;
background:white;
padding:40px;
border-radius:30px;
box-shadow:0 15px 40px rgba(255,105,180,.2);
width:90%;
max-width:420px;
animation:fade 1s;
}

h1{
font-size:32px;
color:#ff4f8b;
margin-bottom:15px;
}

p{
font-size:22px;
color:#666;
margin-bottom:35px;
}

.buttons{
display:flex;
justify-content:center;
gap:20px;
position:relative;
}

button{
padding:14px 35px;
border:none;
border-radius:30px;
font-size:18px;
cursor:pointer;
transition:.3s;
}

#yes{
background:#ff69b4;
color:white;
}

#yes:hover{
transform:scale(1.08);
}

#no{
background:#ddd;
color:#555;
position:relative;
}

.hearts{
position:absolute;
font-size:20px;
animation:float 5s linear infinite;
opacity:.7;
}

@keyframes float{
0%{
transform:translateY(100vh);
opacity:0;
}
100%{
transform:translateY(-120vh);
opacity:1;
}
}

@keyframes fade{
from{
opacity:0;
transform:scale(.8);
}
to{
opacity:1;
transform:scale(1);
}
}
</style>

</head>

<body>

<div class="container" id="page1">
<h1>abdou Can you be mine forever? ♾️❤️</h1>
<p>Choose carefully 🥹</p>

<div class="buttons">
<button id="yes">Yes 💖</button>
<button id="no">No 🙈</button>
</div>

</div>
<script>

const no = document.getElementById("no");
const yes = document.getElementById("yes");
no.addEventListener("click", () => {

    no.textContent = "Yes 💖";
    no.style.background = "#ff69b4";
    no.style.color = "white";

    yes.style.display = "none";

    document.querySelector("h1").textContent = "Good choice 💕";
    document.querySelector("p").textContent = "Loading...";

    setTimeout(showFinal, 3000);

});


yes.addEventListener("click", showFinal);

function showFinal() {
    document.body.innerHTML = `
    <div class="container">
        <h1>Now you're mine ✨🎊</h1>
        <p>I promise to keep you forever ❤️</p>
        <p>Kawter loves you so much 💋</p>
        <div style="font-size:65px;margin-top:20px;">💖💍♾️</div>
    </div>
    `;

    for (let i = 0; i < 40; i++) {
        let h = document.createElement("div");
        h.className = "hearts";
        h.innerHTML = Math.random() > 0.5 ? "💖" : "✨";
        h.style.left = Math.random() * 100 + "vw";
        h.style.animationDuration = (3 + Math.random() * 3) + "s";
        document.body.appendChild(h);
    }
}

</script>

</body>
  </html>
